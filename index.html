<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="screen-orientation" content="landscape" />
    <title>Offbeat Metronome</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="portraitNotice" class="portrait-notice" role="status" aria-live="polite">
      Rotate your phone to landscape to use this metronome.
    </div>
    <main class="app">
      <section class="top-panel">
        <button
          id="tempoControl"
          class="tempo-circle"
          type="button"
          aria-label="Drag left or right to set tempo or tap to type BPM"
        >
          <span id="bpmValue">120</span>
          <input
            id="bpmInput"
            class="tempo-input"
            type="text"
            inputmode="numeric"
            aria-label="Enter tempo in BPM"
            hidden
          />
        </button>
      </section>
      <button id="transportButton" class="transport-button" type="button" aria-label="Play metronome">
        Play
      </button>

      <section class="timeline-panel">
        <div class="timeline-wrap">
          <div id="playhead" class="playhead" aria-hidden="true"></div>
          <div id="majorTrack" class="track major-track" aria-label="Major beats"></div>
          <div
            id="subTrack"
            class="track sub-track"
            aria-label="Subdivision beats"
          ></div>
        </div>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
